<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splat Wallpaper Engine</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
        color: #f3f3f3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.14), transparent 20%),
          linear-gradient(135deg, #050505, #141414 52%, #07120e);
      }

      .status {
        max-width: 680px;
        padding: 24px;
        text-align: center;
        opacity: 0.78;
      }

      .title {
        font-size: 28px;
        font-weight: 650;
        margin-bottom: 10px;
      }

      .detail {
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <section class="status">
        <div class="title">Splat Wallpaper Engine</div>
        <div class="detail">
          Native desktop wallpaper window is running. Next step: wire this renderer host to a local .sog scene and camera controls.
        </div>
      </section>
    </main>
  </body>
</html>
